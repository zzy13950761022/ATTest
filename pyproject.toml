[project]
name = "testagent-cli"
version = "0.1.0"
description = "A controllable CLI agent for C operator test generation"
authors = [{ name = "TestAgent Authors" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.3",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
]

[project.scripts]
testagent = "testagent_cli.cli:app"
attest = "attest_cli.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
